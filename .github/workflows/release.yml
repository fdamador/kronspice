# Copyright (C) 2026 Franklin Amador
#
# On a version tag (v*): run the checks, then publish
#   - static binaries of kronspice and evolve for Linux, Windows and macOS
#     (amd64, arm64) on the GitHub release;
#   - the runtime image   ghcr.io/<owner>/kronspice:<version>      (Dockerfile)
#   - the tools image     ghcr.io/<owner>/kronspice-tools:<version> (race detector,
#     ngspice; internal/golden/docker/Dockerfile)
# both for linux/amd64 and linux/arm64.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 60m ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          dir="kronspice-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "$dir"
          for cmd in kronspice evolve; do
            go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$dir/$cmd$ext" "./cmd/$cmd"
          done
          cp LICENSE LICENSING.md COMMERCIAL-LICENSE.md README.md "$dir/"
          if [ "$GOOS" = windows ]; then zip -r "$dir.zip" "$dir"; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kronspice-*.tar.gz
            kronspice-*.zip

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: kronspice
            context: .
            file: Dockerfile
          - image: kronspice-tools
            context: internal/golden/docker
            file: internal/golden/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
