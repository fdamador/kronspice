<rect x="90.0" y="456.0" width="14" height="4" rx="2" fill="#2a78d6"/>
<text x="110.0" y="461.0" text-anchor="start" fill="#0b0b0b" font-size="13" font-weight="400">kronspice circuit resonance</text>
<rect x="312.4" y="456.0" width="14" height="4" rx="2" fill="#eb6834"/>
<text x="332.4" y="461.0" text-anchor="start" fill="#0b0b0b" font-size="13" font-weight="400">this example&#39;s model (Part 1)</text>
<text x="90.0" y="488.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">All within 60 ppm. The remainders are physics the models leave out: the Dirac level shifts and the Lamb shift for the optical lines; Breit, recoil</text>
<text x="90.0" y="506.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">and proton-structure terms for 21 cm; the bound-state g-factor correction (−α²/3) for ESR. The ESR point is the frequency per tesla, plotted at 1 T.</text>
