<text x="900.0" y="308.0" text-anchor="middle" fill="#52514e" font-size="12" font-weight="400">10²⁴</text>
<line x1="300.0" y1="290.0" x2="900.0" y2="290.0" stroke="#9a988f" stroke-width="1"/>
<text x="600.0" y="332.0" text-anchor="middle" fill="#52514e" font-size="13" font-weight="400">frequency (Hz)</text>
<text x="286.0" y="99.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">Kron network poles (circuit units)</text>
<circle cx="316.0" cy="95.0" r="6" fill="#9a988f" stroke="#fcfcfb" stroke-width="2"/>
<text x="328.0" y="99.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">0.0491 Hz</text>
<text x="286.0" y="129.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">21 cm line (measured)</text>
<circle cx="557.4" cy="125.0" r="6" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/>
<text x="569.4" y="129.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">1.42e+09 Hz</text>
<text x="286.0" y="159.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">Hα (measured)</text>
<circle cx="684.5" cy="155.0" r="6" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/>
<text x="696.5" y="159.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">4.57e+14 Hz</text>
<text x="286.0" y="189.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">1S–2S (measured)</text>
<circle cx="701.4" cy="185.0" r="6" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="2"/>
<text x="713.4" y="189.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">2.47e+15 Hz</text>
<text x="286.0" y="219.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">electron ring, m_e c²/h (H23)</text>
<circle cx="809.8" cy="215.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="797.8" y="219.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">1.24e+20 Hz</text>
<text x="286.0" y="249.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">knot squashing tone (H29)</text>
<circle cx="822.1" cy="245.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="810.1" y="249.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">4.2e+20 Hz</text>
<text x="286.0" y="279.0" text-anchor="end" fill="#0b0b0b" font-size="13" font-weight="400">proton light ring, m_p c²/h (H31)</text>
<circle cx="885.1" cy="275.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="873.1" y="279.0" text-anchor="end" fill="#52514e" font-size="12" font-weight="400">2.27e+23 Hz</text>
<text x="40.0" y="360.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">The atom&#39;s lines (black) are differences of Coulomb levels, 10⁵ below the electron ring&#39;s own frequency and 10⁸ below the proton&#39;s.</text>
<text x="40.0" y="378.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">The network&#39;s poles are an analog: E = 1/ω² − V0 maps them onto the levels, so their frequencies carry the levels, not the light.</text>
</svg>
