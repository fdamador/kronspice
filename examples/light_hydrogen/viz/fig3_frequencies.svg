<line x1="853.8" y1="80.0" x2="853.8" y2="290.0" stroke="#e4e3df" stroke-width="1"/>
<text x="853.8" y="308.0" text-anchor="middle" fill="#52514e" font-size="12" font-weight="400">10²²</text>
