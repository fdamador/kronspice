<text x="40.0" y="360.0" text-anchor="start" fill="#52514e" font-size="12" font-weight="400">The electron ring is 0.0036 a0 and the proton ring 4×10⁻⁶ a0: at the atom&#39;s scale both are points, so the atom is the Coulomb problem.</text>
