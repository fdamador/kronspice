<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Cross-section of the H49 sink electron</title>
<desc>A sink core at the centre removes ether. A dashed circle just outside it marks where a horizon would form, which the heat bound rules out. A two-wire photon ring circles at the electron's ring radius with a horizon resistor across each section. Ether flows radially inward from all sides, and a vortex swirl circles the core. Schematic, not to scale.</desc>
