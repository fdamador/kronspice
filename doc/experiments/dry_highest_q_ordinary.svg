 .box { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 6 5; opacity: .5; }
 .boxlabel { font-size: 14px; font-weight: 600; }
 .note { font-size: 12.5px; opacity: .75; }
 .node { font-size: 14px; font-style: italic; }
</style>
